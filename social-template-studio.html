<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Template Studio</title>
<style>
:root {
  --l50: #FAF0FF; --l100: #F3E0FF; --l200: #E8C8F0; --l300: #D8A8E8;
  --l400: #C483D8; --l500: #B060C8; --l600: #9040A8; --l700: #702888;
  --l800: #501868; --text: #2D1B3D; --mid: #5A3D6A;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, var(--l100), var(--l200)); min-height: 100vh; color: var(--text); overflow: hidden; }
@media (max-width: 767px) { body { overflow-x: hidden; overflow-y: auto; padding-bottom: 60px; } }

/* ── Header ── */
header {
  height: 64px; background: linear-gradient(135deg, var(--l700), var(--l500));
  display: flex; align-items: center; padding: 0 28px; gap: 14px;
  box-shadow: 0 4px 20px rgba(112,40,136,.35);
}
header h1 { color: #fff; font-size: 1.35rem; font-weight: 700; letter-spacing: -.3px; }
header span { color: rgba(255,255,255,.7); font-size: .85rem; }

/* ── Layout ── */
.app { display: grid; grid-template-columns: 260px 1fr 310px; height: calc(100vh - 64px); }
@media (max-width: 767px) { .app { display: block; height: auto; } }

/* ── Left: Template picker ── */
.tpl-bar {
  background: #fff; border-right: 1.5px solid var(--l200);
  overflow-y: auto; padding: 18px 14px;
}
.bar-heading {
  font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--l600); margin-bottom: 12px; padding-left: 2px;
}
.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.tpl-card {
  border: 2px solid var(--l200); border-radius: 12px; padding: 10px 7px 8px;
  cursor: pointer; transition: all .18s; text-align: center; background: var(--l50);
  user-select: none;
}
.tpl-card:hover { border-color: var(--l400); transform: translateY(-2px); box-shadow: 0 5px 14px rgba(144,64,168,.15); }
.tpl-card.active { border-color: var(--l600); background: var(--l100); }
.tpl-thumb {
  width: 100%; background: linear-gradient(135deg, var(--l300), var(--l500));
  border-radius: 7px; margin-bottom: 6px; display: flex; align-items: center;
  justify-content: center; font-size: 1.2rem; overflow: hidden;
}
.tpl-label { font-size: .68rem; font-weight: 700; color: var(--mid); line-height: 1.3; }
.tpl-dims { font-size: .59rem; color: var(--l500); margin-top: 2px; }

/* ── Centre: Canvas ── */
.canvas-area {
  background: #dcc8ea; display: flex; align-items: center; justify-content: center;
  padding: 28px; position: relative; overflow: hidden;
}
.canvas-wrap {
  position: relative; box-shadow: 0 24px 64px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.1);
  border-radius: 6px; line-height: 0;
}
#cvs { display: block; border-radius: 6px; }

/* ── Right: Edit panel ── */
.edit-panel {
  background: #fff; border-left: 1.5px solid var(--l200);
  overflow-y: auto; padding: 18px 16px;
  display: flex; flex-direction: column; gap: 20px;
}
.ep-section {}
.ep-title {
  font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--l600); padding-bottom: 8px; border-bottom: 1px solid var(--l100);
  margin-bottom: 12px;
}
.fg { margin-bottom: 10px; }
label { display: block; font-size: .76rem; font-weight: 600; color: var(--mid); margin-bottom: 3px; }
input[type=text], textarea, select {
  width: 100%; padding: 7px 10px; border: 1.5px solid var(--l200); border-radius: 8px;
  font-size: .82rem; color: var(--text); outline: none; transition: border-color .18s;
  font-family: inherit; background: var(--l50);
}
input[type=text]:focus, textarea:focus, select:focus {
  border-color: var(--l500); box-shadow: 0 0 0 3px rgba(176,96,200,.1);
}
textarea { resize: vertical; min-height: 72px; }
input[type=color] {
  width: 34px; height: 34px; border: 2px solid var(--l200); border-radius: 8px;
  padding: 2px; cursor: pointer; flex-shrink: 0;
}
input[type=range] { width: 100%; accent-color: var(--l500); }
.row-color { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row-color label { margin-bottom: 0; flex: 1; }
.presets { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
.preset-swatch {
  width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
  border: 2.5px solid transparent; transition: all .18s; flex-shrink: 0;
}
.preset-swatch:hover, .preset-swatch.active { border-color: var(--l700); transform: scale(1.15); }
.size-row { display: flex; align-items: center; gap: 8px; }
.size-row input[type=number] { width: 58px; text-align: center; flex-shrink: 0; }
.size-row .sl { flex: 1; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 16px; border: none; border-radius: 10px;
  font-size: .85rem; font-weight: 600; cursor: pointer; transition: all .18s;
  font-family: inherit; width: 100%;
}
.btn-dl {
  background: linear-gradient(135deg, var(--l700), var(--l500)); color: #fff;
  padding: 13px; font-size: .92rem; margin-bottom: 8px;
}
.btn-dl:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(144,64,168,.4); }
.btn-sec {
  background: var(--l100); color: var(--l700);
  border: 1.5px solid var(--l300);
}
.btn-sec:hover { background: var(--l200); }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--l300); border-radius: 10px; }

/* ── Mobile panels ── */
.mobile-tabs { display: none; }

@media (max-width: 767px) {
  .tpl-bar, .canvas-area, .edit-panel { display: none; }
  .tpl-bar.tab-active, .edit-panel.tab-active { display: block; height: auto; max-height: calc(100dvh - 124px); overflow-y: auto; }
  .canvas-area.tab-active { display: flex; min-height: 50vw; height: auto; padding: 16px; }

  .tpl-bar { border-right: none; border-bottom: 1.5px solid var(--l200); }
  .edit-panel { border-left: none; }
  .tpl-grid { grid-template-columns: repeat(3, 1fr); }

  header h1 { font-size: 1.05rem; }
  header span { display: none; }
  header { padding: 0 16px; gap: 10px; }

  .mobile-tabs {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: #fff;
    border-top: 1.5px solid var(--l200);
    box-shadow: 0 -4px 14px rgba(0,0,0,.08);
    z-index: 300;
  }
  .mobile-tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; cursor: pointer; color: var(--mid);
    font-size: .64rem; font-weight: 600;
    background: none; border: none; font-family: inherit;
    padding: 6px 0 8px; transition: color .15s; user-select: none;
  }
  .mobile-tab .ti { font-size: 1.25rem; line-height: 1; }
  .mobile-tab.active { color: var(--l600); }
}
</style>
</head>
<body>

<header>
  <h1>&#10024; Social Template Studio</h1>
  <span>Pick a format &rarr; edit &rarr; download</span>
</header>

<div class="app">

  <!-- Template picker -->
  <div class="tpl-bar">
    <div class="bar-heading">Format</div>
    <div class="tpl-grid" id="tplGrid"></div>
  </div>

  <!-- Canvas -->
  <div class="canvas-area">
    <div class="canvas-wrap"><canvas id="cvs"></canvas></div>
  </div>

  <!-- Edit panel -->
  <div class="edit-panel">

    <div class="ep-section">
      <div class="ep-title">Content</div>
      <div class="fg"><label>Headline</label>
        <input type="text" id="headline" value="Your Amazing Headline"></div>
      <div class="fg"><label>Body / Caption</label>
        <textarea id="body">Add your description or call to action here.</textarea></div>
      <div class="fg"><label>Handle / Tag</label>
        <input type="text" id="handle" value="@yourbrand"></div>
      <div class="fg"><label>Button Text</label>
        <input type="text" id="cta" value="Learn More"></div>
    </div>

    <div class="ep-section">
      <div class="ep-title">Background</div>
      <div class="fg"><label>Style</label>
        <select id="bgStyle">
          <option value="gradient">Gradient</option>
          <option value="radial">Radial Glow</option>
          <option value="solid">Solid</option>
          <option value="mesh">Mesh</option>
        </select>
      </div>
      <div class="fg"><label>Presets</label>
        <div class="presets" id="presets"></div>
      </div>
      <div class="row-color"><label>Color A</label><input type="color" id="c1" value="#C483D8"></div>
      <div class="row-color"><label>Color B</label><input type="color" id="c2" value="#9040A8"></div>
    </div>

    <div class="ep-section">
      <div class="ep-title">Typography</div>
      <div class="fg"><label>Font</label>
        <select id="font">
          <option value="'Segoe UI',sans-serif">Segoe UI</option>
          <option value="Georgia,serif">Georgia</option>
          <option value="'Arial Black',sans-serif">Arial Black</option>
          <option value="Impact,sans-serif">Impact</option>
          <option value="'Palatino Linotype',serif">Palatino</option>
          <option value="'Courier New',monospace">Courier New</option>
        </select>
      </div>
      <div class="fg"><label>Headline Size</label>
        <div class="size-row">
          <input type="number" id="hSize" value="68" min="18" max="220">
          <div class="sl"><input type="range" id="hSlider" min="18" max="220" value="68"></div>
        </div>
      </div>
      <div class="row-color"><label>Text Color</label><input type="color" id="tColor" value="#FFFFFF"></div>
      <div class="row-color"><label>Accent Color</label><input type="color" id="aColor" value="#FFD700"></div>
    </div>

    <div class="ep-section">
      <div class="ep-title">Layout</div>
      <div class="fg"><label>Alignment</label>
        <select id="align">
          <option value="center">Center</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </div>
      <div class="fg"><label>Overlay Opacity (%)</label>
        <input type="range" id="overlayOpacity" min="0" max="60" value="15">
      </div>
    </div>

    <div class="ep-section">
      <div class="ep-title">Export</div>
      <button class="btn btn-dl" id="dlBtn">&#8659; Download Full-Size PNG</button>
      <button class="btn btn-sec" id="copyBtn">Copy Style to Clipboard (JSON)</button>
    </div>

  </div>
</div>

<nav class="mobile-tabs" id="mobileTabs" aria-label="Sections">
  <button class="mobile-tab active" data-panel="tpl-bar">
    <span class="ti">&#9783;</span><span>Format</span>
  </button>
  <button class="mobile-tab" data-panel="canvas-area">
    <span class="ti">&#9673;</span><span>Preview</span>
  </button>
  <button class="mobile-tab" data-panel="edit-panel">
    <span class="ti">&#9998;</span><span>Edit</span>
  </button>
</nav>

<script>
// ── Templates ──────────────────────────────────────────────────
const TEMPLATES = [
  { id:'ig_sq',    label:'Instagram',   platform:'Instagram', w:1080, h:1080, icon:'📷', ar:'1/1' },
  { id:'ig_story', label:'Story',       platform:'Instagram', w:1080, h:1920, icon:'📱', ar:'9/16' },
  { id:'twitter',  label:'X / Twitter', platform:'Twitter',   w:1200, h:675,  icon:'✕',  ar:'16/9' },
  { id:'fb',       label:'Facebook',    platform:'Facebook',  w:1200, h:630,  icon:'f',  ar:'1.9/1' },
  { id:'li',       label:'LinkedIn',    platform:'LinkedIn',  w:1200, h:627,  icon:'in', ar:'1.9/1' },
  { id:'pin',      label:'Pinterest',   platform:'Pinterest', w:1000, h:1500, icon:'P',  ar:'2/3' },
  { id:'yt',       label:'YouTube',     platform:'YouTube',   w:1280, h:720,  icon:'▶',  ar:'16/9' },
  { id:'tiktok',   label:'TikTok',      platform:'TikTok',    w:1080, h:1920, icon:'♪',  ar:'9/16' },
];

const PRESETS = [
  ['#C483D8','#9040A8'], ['#FF6B9D','#C044A8'], ['#4158D0','#C850C0'],
  ['#0093E9','#80D0C7'], ['#FF9A9E','#FECFEF'], ['#A18CD1','#FBC2EB'],
  ['#E8D5F0','#B070C0'], ['#2D1B4E','#0D0D2B'], ['#F8C8C8','#E870A0'],
  ['#FFD700','#FF8C00'],
];

let cur = TEMPLATES[0];
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');

// ── Build template cards ───────────────────────────────────────
const grid = document.getElementById('tplGrid');
TEMPLATES.forEach(t => {
  const card = document.createElement('div');
  card.className = 'tpl-card' + (t.id === cur.id ? ' active' : '');
  // Aspect ratio thumb using padding-top trick
  const [aw, ah] = t.ar.split('/').map(Number);
  const pct = (ah / aw * 100).toFixed(1);
  card.innerHTML = `
    <div class="tpl-thumb" style="padding-top:${Math.min(pct,130)}%">
      <span style="position:absolute;font-size:1.3rem">${t.icon}</span>
    </div>
    <div class="tpl-label">${t.label}</div>
    <div class="tpl-dims">${t.w}&times;${t.h}</div>`;
  card.querySelector('.tpl-thumb').style.position = 'relative';
  card.addEventListener('click', () => {
    document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    cur = t;
    resizeCvs();
    draw();
    if (isMobile()) applyActiveTab('canvas-area');
  });
  grid.appendChild(card);
});

// ── Build preset swatches ──────────────────────────────────────
const presetsEl = document.getElementById('presets');
PRESETS.forEach(([a, b], i) => {
  const el = document.createElement('div');
  el.className = 'preset-swatch' + (i === 0 ? ' active' : '');
  el.style.background = `linear-gradient(135deg,${a},${b})`;
  el.addEventListener('click', () => {
    document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('c1').value = a;
    document.getElementById('c2').value = b;
    draw();
  });
  presetsEl.appendChild(el);
});

// ── Sync slider ↔ number ───────────────────────────────────────
const hSize = document.getElementById('hSize');
const hSlider = document.getElementById('hSlider');
hSize.addEventListener('input', () => { hSlider.value = hSize.value; draw(); });
hSlider.addEventListener('input', () => { hSize.value = hSlider.value; draw(); });

// ── Wire all inputs ────────────────────────────────────────────
['headline','body','handle','cta','bgStyle','c1','c2','font','tColor','aColor','align','overlayOpacity']
  .forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', draw);
    el.addEventListener('change', draw);
  });

// ── Canvas sizing ──────────────────────────────────────────────
function resizeCvs() {
  const mobile = window.innerWidth < 768;
  const maxW = mobile ? window.innerWidth - 32 : window.innerWidth - 260 - 310 - 64;
  const maxH = mobile ? window.innerHeight * 0.62 : window.innerHeight - 64 - 60;
  const sc = Math.min(maxW / cur.w, maxH / cur.h, 1);
  cvs.width  = Math.floor(cur.w * sc);
  cvs.height = Math.floor(cur.h * sc);
}

// ── Read all values ────────────────────────────────────────────
function vals() {
  return {
    headline: document.getElementById('headline').value,
    body:     document.getElementById('body').value,
    handle:   document.getElementById('handle').value,
    cta:      document.getElementById('cta').value,
    bgStyle:  document.getElementById('bgStyle').value,
    c1:       document.getElementById('c1').value,
    c2:       document.getElementById('c2').value,
    font:     document.getElementById('font').value,
    hSize:    parseInt(hSize.value) || 68,
    tColor:   document.getElementById('tColor').value,
    aColor:   document.getElementById('aColor').value,
    align:    document.getElementById('align').value,
    overlayOpacity: parseInt(document.getElementById('overlayOpacity').value) / 100,
  };
}

// ── Master render function ─────────────────────────────────────
// Draws everything into targetCtx at native tplW × tplH (uses ctx.scale internally)
function render(targetCtx, tplW, tplH, v) {
  targetCtx.clearRect(0, 0, tplW, tplH);
  const W = tplW, H = tplH;
  const portrait = H > W;

  // ─ Background ─
  let bg;
  if (v.bgStyle === 'gradient') {
    bg = targetCtx.createLinearGradient(0, 0, W, H);
  } else if (v.bgStyle === 'radial') {
    bg = targetCtx.createRadialGradient(W*.5, H*.45, 0, W*.5, H*.45, Math.max(W,H)*.72);
  } else if (v.bgStyle === 'mesh') {
    bg = targetCtx.createLinearGradient(0, 0, W, H);
  } else {
    bg = null; // solid
  }

  if (bg) { bg.addColorStop(0, v.c1); bg.addColorStop(1, v.c2); }
  targetCtx.fillStyle = bg || v.c1;
  targetCtx.fillRect(0, 0, W, H);

  // Mesh extra layer
  if (v.bgStyle === 'mesh') {
    const bg2 = targetCtx.createRadialGradient(W*.8, H*.2, 0, W*.8, H*.2, W*.6);
    bg2.addColorStop(0, v.c2 + '88');
    bg2.addColorStop(1, 'transparent');
    targetCtx.fillStyle = bg2;
    targetCtx.fillRect(0, 0, W, H);
    const bg3 = targetCtx.createRadialGradient(W*.2, H*.8, 0, W*.2, H*.8, W*.5);
    bg3.addColorStop(0, v.c1 + '88');
    bg3.addColorStop(1, 'transparent');
    targetCtx.fillStyle = bg3;
    targetCtx.fillRect(0, 0, W, H);
  }

  // ─ Soft overlay circles ─
  targetCtx.save();
  targetCtx.globalAlpha = v.overlayOpacity;
  [[W*.9, H*.07, W*.14], [W*.1, H*.93, W*.1], [W*-.02, H*.25, W*.18]].forEach(([cx,cy,r]) => {
    targetCtx.beginPath();
    targetCtx.arc(cx, cy, r, 0, Math.PI*2);
    targetCtx.fillStyle = '#fff';
    targetCtx.fill();
  });
  targetCtx.restore();

  // ─ Accent top divider line ─
  const lineY = H * (portrait ? .18 : .2);
  targetCtx.save();
  targetCtx.globalAlpha = .5;
  targetCtx.strokeStyle = v.aColor;
  targetCtx.lineWidth = W * .004;
  targetCtx.lineCap = 'round';
  targetCtx.beginPath();
  targetCtx.moveTo(W*.12, lineY);
  targetCtx.lineTo(W*.88, lineY);
  targetCtx.stroke();
  targetCtx.restore();

  // ─ Platform badge ─
  const badgeH = H * .038;
  const badgeW = W * .22;
  const badgeX = W * .05;
  const badgeY = H * .05 - badgeH / 2;
  targetCtx.save();
  targetCtx.fillStyle = 'rgba(255,255,255,.18)';
  rrect(targetCtx, badgeX, badgeY, badgeW, badgeH, badgeH * .5);
  targetCtx.fill();
  targetCtx.font = `600 ${badgeH * .6}px ${v.font}`;
  targetCtx.fillStyle = v.tColor;
  targetCtx.globalAlpha = .85;
  targetCtx.textAlign = 'center';
  targetCtx.textBaseline = 'middle';
  targetCtx.fillText(cur.platform, badgeX + badgeW / 2, badgeY + badgeH / 2);
  targetCtx.restore();

  // ─ Text layout ─
  const axPct  = v.align === 'center' ? .5 : v.align === 'left' ? .1 : .9;
  const ax     = W * axPct;
  const maxTW  = W * .8;
  const hsFull = v.hSize / 1080 * W;   // headline font size scaled to W
  const bsFull = hsFull * .38;          // body font
  const hLineH = hsFull * 1.22;
  const bLineH = bsFull * 1.4;

  const headlineTop = portrait ? H * .25 : H * .28;

  // Headline
  targetCtx.save();
  targetCtx.font = `700 ${hsFull}px ${v.font}`;
  targetCtx.fillStyle = v.tColor;
  targetCtx.textAlign = v.align;
  targetCtx.textBaseline = 'top';
  targetCtx.shadowColor = 'rgba(0,0,0,.22)';
  targetCtx.shadowBlur = hsFull * .12;
  const headlineLines = wrapLines(targetCtx, v.headline, maxTW);
  headlineLines.forEach((line, i) => targetCtx.fillText(line, ax, headlineTop + i * hLineH));
  targetCtx.restore();

  const bodyTop = headlineTop + headlineLines.length * hLineH + hsFull * .4;

  // Body text
  if (v.body.trim()) {
    targetCtx.save();
    targetCtx.font = `${bsFull}px ${v.font}`;
    targetCtx.fillStyle = v.tColor;
    targetCtx.globalAlpha = .82;
    targetCtx.textAlign = v.align;
    targetCtx.textBaseline = 'top';
    const bodyLines = wrapLines(targetCtx, v.body, maxTW);
    bodyLines.forEach((line, i) => targetCtx.fillText(line, ax, bodyTop + i * bLineH));
    targetCtx.restore();
  }

  // CTA button
  if (v.cta.trim()) {
    const btnH2  = hsFull * .72;
    const btnPad = hsFull * .55;
    targetCtx.save();
    targetCtx.font = `700 ${hsFull * .32}px ${v.font}`;
    const btnW2 = targetCtx.measureText(v.cta).width + btnPad * 2;
    const btnX2 = W / 2 - btnW2 / 2;
    const btnY2 = portrait ? H * .74 : H * .76;
    // shadow
    targetCtx.shadowColor = 'rgba(0,0,0,.28)';
    targetCtx.shadowBlur = btnH2 * .3;
    targetCtx.shadowOffsetY = btnH2 * .1;
    targetCtx.fillStyle = v.aColor;
    rrect(targetCtx, btnX2, btnY2 - btnH2/2, btnW2, btnH2, btnH2/2);
    targetCtx.fill();
    targetCtx.shadowColor = 'transparent';
    targetCtx.shadowBlur = 0;
    targetCtx.shadowOffsetY = 0;
    // button text — pick contrast colour
    const btnTextCol = luminance(v.aColor) > .35 ? '#1a1a1a' : '#ffffff';
    targetCtx.fillStyle = btnTextCol;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    targetCtx.fillText(v.cta, W/2, btnY2);
    targetCtx.restore();
  }

  // Handle
  if (v.handle.trim()) {
    targetCtx.save();
    targetCtx.font = `${W*.021}px ${v.font}`;
    targetCtx.fillStyle = v.tColor;
    targetCtx.globalAlpha = .65;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'bottom';
    targetCtx.fillText(v.handle, W/2, H - H*.035);
    targetCtx.restore();
  }
}

// ── Rounded rect helper ────────────────────────────────────────
function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y);
  c.arcTo(x+w, y, x+w, y+r, r);
  c.lineTo(x+w, y+h-r);
  c.arcTo(x+w, y+h, x+w-r, y+h, r);
  c.lineTo(x+r, y+h);
  c.arcTo(x, y+h, x, y+h-r, r);
  c.lineTo(x, y+r);
  c.arcTo(x, y, x+r, y, r);
  c.closePath();
}

// ── Word-wrap helper ───────────────────────────────────────────
function wrapLines(ctx2, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let cur2 = '';
  for (const word of words) {
    const test = cur2 ? cur2 + ' ' + word : word;
    if (ctx2.measureText(test).width > maxWidth && cur2) {
      lines.push(cur2);
      cur2 = word;
    } else {
      cur2 = test;
    }
  }
  if (cur2) lines.push(cur2);
  return lines.length ? lines : [''];
}

// ── Luminance for contrast ─────────────────────────────────────
function luminance(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const toLinear = c => c <= .04045 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4);
  return .2126*toLinear(r) + .7152*toLinear(g) + .0722*toLinear(b);
}

// ── Preview draw ───────────────────────────────────────────────
function draw() {
  const v = vals();
  // Scale native template into preview canvas
  const scX = cvs.width  / cur.w;
  const scY = cvs.height / cur.h;
  ctx.save();
  ctx.scale(scX, scY);
  render(ctx, cur.w, cur.h, v);
  ctx.restore();
}

// ── Download (full native resolution) ─────────────────────────
document.getElementById('dlBtn').addEventListener('click', () => {
  const offCvs = document.createElement('canvas');
  offCvs.width  = cur.w;
  offCvs.height = cur.h;
  const offCtx = offCvs.getContext('2d');
  render(offCtx, cur.w, cur.h, vals());
  offCvs.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href     = url;
    a.download = `social_${cur.id}_${Date.now()}.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
});

// ── Copy style JSON ────────────────────────────────────────────
document.getElementById('copyBtn').addEventListener('click', () => {
  const v = vals();
  const payload = JSON.stringify({ background:[v.c1,v.c2], bgStyle:v.bgStyle, font:v.font, headlineSize:v.hSize, textColor:v.tColor, accentColor:v.aColor, align:v.align }, null, 2);
  navigator.clipboard.writeText(payload).then(() => {
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1600);
  });
});

// ── Mobile tab switching ───────────────────────────────────────
function isMobile() { return window.innerWidth < 768; }

function applyActiveTab(panelId) {
  ['tpl-bar', 'canvas-area', 'edit-panel'].forEach(id => {
    document.querySelector(`.${id}`).classList.toggle('tab-active', id === panelId);
  });
  document.querySelectorAll('.mobile-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.panel === panelId);
  });
  if (panelId === 'canvas-area') { resizeCvs(); draw(); }
}

function initMobileLayout() {
  if (isMobile()) {
    applyActiveTab('tpl-bar');
  } else {
    ['tpl-bar', 'canvas-area', 'edit-panel'].forEach(id => {
      document.querySelector(`.${id}`).classList.remove('tab-active');
    });
  }
}

document.getElementById('mobileTabs').addEventListener('click', e => {
  const tab = e.target.closest('.mobile-tab');
  if (tab && isMobile()) applyActiveTab(tab.dataset.panel);
});

// ── Init ───────────────────────────────────────────────────────
initMobileLayout();
resizeCvs();
draw();
window.addEventListener('resize', () => { initMobileLayout(); resizeCvs(); draw(); });
</script>
